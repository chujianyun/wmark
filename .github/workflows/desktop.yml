name: Desktop checks and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundle: dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundle: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --reporter=default --reporter=json --outputFile=frontend-tests.json
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Verify version matches release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-version.mjs
      - name: Build desktop installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
      - name: Prepare distributable files
        shell: bash
        run: |
          mkdir -p release-artifacts
          find target/${{ matrix.target }}/release/bundle -type f \( -name '*.dmg' -o -name '*-setup.exe' \) -exec cp {} release-artifacts/ \;
          node scripts/check-artifacts.mjs release-artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}
          path: release-artifacts/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ matrix.target }}
          path: frontend-tests.json
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-artifacts
      - name: Verify matrix output and create checksums
        run: |
          test "$(find release-artifacts -name '*.dmg' | wc -l)" -eq 2
          test "$(find release-artifacts -name '*-setup.exe' | wc -l)" -eq 1
          cd release-artifacts
          sha256sum *.dmg *.exe > SHA256SUMS.txt
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-artifacts/* --verify-tag --title "Wmark $GITHUB_REF_NAME" --notes-file docs/release-notes.md --prerelease
